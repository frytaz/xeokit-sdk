<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>xeokit visual test</title>
    <link href="css/pageStyle.css" rel="stylesheet" />
  </head>
  <body>
    <canvas id="myCanvas"></canvas>
  </body>
  <script type="module">
    // LASzip-compressed LAS 1.2 point cloud (point data record format 3, 16-bit colors)
    import { Viewer, LASLoaderPlugin } from "../../dist/xeokit-sdk.min.es.js";
    import { signalTestComplete } from "./lib/utils.js";
    const viewer = new Viewer({
      canvasId: "myCanvas",
      transparent: true,
    });
    viewer.scene.pointsMaterial.pointSize = 2;
    const lasLoader = new LASLoaderPlugin(viewer, {
      skip: 2,
      fp64: false,
      colorDepth: "auto",
      rotateX: true,
    });
    const sceneModel = lasLoader.load({
      id: "myModel",
      src: "../../assets/models/las/federated/autzen/autzen_2.laz",
    });
    sceneModel.on("loaded", () => {
      if (sceneModel.numEntities !== 1) {
        console.error("LAZ model did not load as expected");
      }
      viewer.cameraFlight.jumpTo({ aabb: sceneModel.aabb });
      viewer.scene.camera.orbitPitch(-60);
      signalTestComplete(viewer);
    });
  </script>
</html>
