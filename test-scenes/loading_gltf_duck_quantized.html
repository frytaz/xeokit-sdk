<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>xeokit visual test</title>
    <link href="css/pageStyle.css" rel="stylesheet" />
  </head>
  <body>
    <canvas id="myCanvas"></canvas>
  </body>
  <script type="module">
    // glTF 2.0 with KHR_mesh_quantization, KHR_texture_transform and a PNG texture
    import { Viewer, GLTFLoaderPlugin } from "../../dist/xeokit-sdk.min.es.js";
    import { signalTestComplete } from "./lib/utils.js";
    const viewer = new Viewer({
      canvasId: "myCanvas",
      transparent: true,
      colorTextureEnabled: true,
    });
    viewer.scene.camera.eye = [2.5, 2.0, 2.5];
    viewer.scene.camera.look = [0.13, 0.87, -0.04];
    viewer.scene.camera.up = [-0.3, 0.9, -0.3];
    const gltfLoader = new GLTFLoaderPlugin(viewer);
    const sceneModel = gltfLoader.load({
      id: "myModel",
      src: "../../assets/models/gltf/Duck-Quantized/Duck.gltf",
      colorTextureEnabled: true,
    });
    sceneModel.on("loaded", () => {
      signalTestComplete(viewer);
    });
  </script>
</html>
