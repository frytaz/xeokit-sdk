<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>xeokit visual test</title>
    <link href="css/pageStyle.css" rel="stylesheet" />
  </head>
  <body>
    <canvas id="myCanvas"></canvas>
  </body>
  <script type="module">
    // LAS 1.5, uncompressed (393-byte header, format 7), decoded on the main thread (workerEnabled: false)
    import { Viewer, LASLoaderPlugin } from "../../dist/xeokit-sdk.min.es.js";
    import { signalTestComplete } from "./lib/utils.js";
    const viewer = new Viewer({
      canvasId: "myCanvas",
      transparent: true,
    });
    viewer.scene.pointsMaterial.pointSize = 3;
    viewer.scene.pointsMaterial.perspectivePoints = false;
    const lasLoader = new LASLoaderPlugin(viewer, {
      skip: 1,
      fp64: false,
      colorDepth: "auto",
      rotateX: true,
      workerEnabled: false,
    });
    const sceneModel = lasLoader.load({
      id: "myModel",
      src: "../../assets/models/las/simple_1.5.las",
    });
    sceneModel.on("loaded", () => {
      const metaModel = viewer.metaScene.metaModels[sceneModel.id];
      const header = metaModel.rootMetaObject.children[0].attributes;
      if (sceneModel.numEntities !== 1 || header.VersionMinor !== 5 || header.PointDataFormatID !== 7 || header.epsg !== 2991) {
        console.error("LAS model did not load as expected", header);
      }
      viewer.cameraFlight.jumpTo({ aabb: sceneModel.aabb });
      viewer.scene.camera.orbitPitch(-60);
      signalTestComplete(viewer);
    });
  </script>
</html>
